name: Agent-friendly score diff
description: Check AI agent readiness on every pull request, with a comment on how it changes your score per coding agent.
author: hsnice16

branding:
  icon: bar-chart-2
  color: gray-dark

inputs:
  agents-badge-token:
    description: Opt-in marker. The action exits silently when this is empty. Pass a non-empty string (e.g. via secrets) to enable the PR comment.
    required: true
  github-token:
    description: Token used to post or edit the PR comment. Defaults to the workflow's built-in GITHUB_TOKEN. A GitHub App installation token or a PAT also works.
    required: false
    default: ${{ github.token }}
  base-ref:
    description: Override the PR base ref. Leave unset to use the event's base.
    required: false

runs:
  using: node24
  main: dist/index.js
