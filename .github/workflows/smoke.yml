name: Smoke

on:
  pull_request:

# Two runs at once could each post a comment.
concurrency:
  group: smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  self-score:
    # Fork and Dependabot PRs get a read-only token, so the comment would fail.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run action against this PR
        uses: ./
        with:
          agents-badge-token: smoke-test
